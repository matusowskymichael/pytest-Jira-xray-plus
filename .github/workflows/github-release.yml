name: Tag verified PyPI release
on:
  workflow_run:
    workflows: [Publish release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful existing Publish release run ID (retry/backfill only; never republishes PyPI)
        required: true
        type: string
permissions: {}
concurrency:
  group: verified-github-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'matusowskymichael/pytest-Jira-xray-plus' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify publication and create or resume matching tag/release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
        run: python tools/tag_release.py --run-id "$PUBLISH_RUN_ID"
