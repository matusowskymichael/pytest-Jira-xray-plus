name: documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/prepare_docs_site.py
      - run: python -m mkdocs build --strict
      - run: python tools/check_docs_links.py
      - run: python tools/check_docs_browser.py
        env:
          DOCS_SCREENSHOTS: docs-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-preview
          path: |
            site/
            docs-screenshots/
          if-no-files-found: error
