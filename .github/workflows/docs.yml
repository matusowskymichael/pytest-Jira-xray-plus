name: documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/prepare_docs_site.py
      - run: python -m mkdocs build --strict
      - run: python tools/check_docs_links.py
      - run: python tools/check_docs_browser.py
        env:
          DOCS_SCREENSHOTS: docs-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-preview
          path: |
            site/
            docs-screenshots/
          if-no-files-found: error
