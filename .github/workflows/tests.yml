name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest-httpserver pytest-xdist pytest-rerunfailures build twine
      - run: pytest -q
      - run: python tools/reproduce.py src --details
      - run: python -m build
      - run: python -m twine check dist/*
