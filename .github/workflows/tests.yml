name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-tests.txt build==1.6.1 setuptools==84.0.0 wheel==0.48.0 twine==7.0.0 'readme-renderer[md]'
      - name: Measure plugin coverage including subprocesses
        if: matrix.python == '3.12'
        run: python tools/measure_coverage.py
      - run: python -m pytest -q
        if: matrix.python != '3.12'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.12'
        with:
          name: plugin-coverage-python-3.12
          path: .harness/coverage/public/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.python == '3.12'
        with:
          name: plugin-coverage-test-log
          path: .harness/coverage/latest-tests.log
          if-no-files-found: warn
      - run: python tools/reproduce.py src --details
      - run: python tools/validate_offline.py
      - run: python tools/build_release.py release-dist
      - run: python -m twine check release-dist/*
      - name: Check installed wheel examples and full PyPI description
        run: |
          python -m venv /tmp/xray-wheel
          /tmp/xray-wheel/bin/python -m pip install release-dist/*.whl pytest-xdist==3.8.0 pytest-rerunfailures==16.7
          python tools/check_installed_usage.py /tmp/xray-wheel/bin/python release-dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readme-preview-python-${{ matrix.python }}
          path: release-dist/README-preview.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions-python-${{ matrix.python }}
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
          if-no-files-found: error
