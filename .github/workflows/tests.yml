name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-tests.txt build==1.6.1 wheel==0.48.0 twine==7.0.0 'readme-renderer[md]'
      - run: python tools/install_build_dependencies.py
      - name: Measure plugin coverage including subprocesses
        if: matrix.python == '3.12'
        run: python tools/measure_coverage.py
      - run: python -m pytest -q
        if: matrix.python != '3.12'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.12'
        with:
          name: plugin-coverage-python-3.12
          path: .harness/coverage/public/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.python == '3.12'
        with:
          name: plugin-coverage-test-log
          path: .harness/coverage/latest-tests.log
          if-no-files-found: warn
      - run: python tools/reproduce.py src --details
      - run: python tools/validate_offline.py
      - run: python tools/build_release.py release-dist
      - run: python -m twine check release-dist/*
      - name: Check installed wheel examples and full PyPI description
        run: |
          python -m venv /tmp/xray-wheel
          /tmp/xray-wheel/bin/python -m pip install release-dist/*.whl pytest-xdist==3.8.0 pytest-rerunfailures==16.7
          python tools/check_installed_usage.py /tmp/xray-wheel/bin/python release-dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readme-preview-python-${{ matrix.python }}
          path: release-dist/README-preview.html
      - name: Record publisher handoff hashes
        if: matrix.python == '3.12'
        run: |
          python - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          files = list(Path('release-dist').glob('*.whl')) + list(Path('release-dist').glob('*.tar.gz'))
          assert len(files) == 2
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          (Path(os.environ['RUNNER_TEMP']) / 'publisher-handoff-hashes.json').write_text(json.dumps(hashes))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: distributions
        with:
          name: release-distributions-python-${{ matrix.python }}
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
          if-no-files-found: error
      - name: Smoke-test publisher artifact download without publishing
        if: matrix.python == '3.12'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.distributions.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/publisher-handoff
      - name: Verify exact downloaded distributions and installed guide
        if: matrix.python == '3.12'
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((temporary / 'publisher-handoff-hashes.json').read_text())
          root = temporary / 'publisher-handoff'
          assert {p.name for p in root.iterdir()} == set(expected)
          for name, digest in expected.items():
              path = root / name
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          wheel = next(root.glob('*.whl'))
          subprocess.run(['/tmp/xray-wheel/bin/python', '-m', 'pip', 'install', '--no-deps',
                          '--force-reinstall', str(wheel)], check=True)
          subprocess.run(['python', 'tools/check_installed_usage.py',
                          '/tmp/xray-wheel/bin/python', str(wheel)], check=True)
          PYTHON
