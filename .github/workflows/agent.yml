name: repository harness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/agent.py preflight
      - run: python tools/agent.py drift
      - run: python tools/agent.py check --profile harness
      - run: python -m pip install ruff==0.14.3
      - run: python -m ruff check tools/agent.py tools/check_harness_tests.py tests/agent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: harness-evidence
          path: .harness/evidence/
          include-hidden-files: true
          if-no-files-found: error
