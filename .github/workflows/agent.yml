name: repository harness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/agent.py preflight
      - run: python tools/agent.py drift
      - run: python tools/agent.py check --profile harness
      - run: python -m pip install ruff==0.14.3
      - run: python -m ruff check tools/agent.py tools/check_harness_tests.py tests/agent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: harness-evidence
          path: .harness/evidence/
          include-hidden-files: true
          if-no-files-found: error
