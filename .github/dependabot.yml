version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
