[project]
name = "pytest-jira-xray-plus"
description = "Integrate pytest results with Jira and Xray, with parameter comments and case audit reports"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lukasz Fundakowski", email = "fundakol@yahoo.com" }]
keywords = ["pytest, JIRA, XRAY"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Pytest",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["pytest>=9.1.1,<10", "requests>=2.34.2,<3"]
version = "0.1.9"

[project.urls]
Documentation = "https://matusowskymichael.github.io/pytest-Jira-xray-plus/"
Repository = "https://github.com/matusowskymichael/pytest-Jira-xray-plus"
Issues = "https://github.com/matusowskymichael/pytest-Jira-xray-plus/issues"
Upstream = "https://github.com/fundakol/pytest-jira-xray"

[project.entry-points.pytest11]
xray = "pytest_xray.plugin"

[dependency-groups]
dev = [
  "pre-commit>=4.3.0",
  "tox>=4.30.3",
  { include-group = "lint" },
  { include-group = "test" },
]
lint = [
  "mypy>=1.18.2",
  "ruff>=0.14.3",
  "types-requests>=2.32.4.20250913",
]
test = [
  "coverage>=7.10.0",
  "pytest-httpserver>=1.1.3",
  "pytest-xdist>=3.8.0",
  "pytest-rerunfailures>=16.7",
]

[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ["py39"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
filter_files = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
files = ["src", "tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = [
  "src",
  "tests",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",  # isort
]
ignore = [
  "SIM108",  # if-else-block-instead-of-if-exp
]

[tool.ruff.format]
quote-style = "single"

[tool.setuptools_scm]
